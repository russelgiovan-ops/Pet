<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6c63ff">

<title>Digital Pet 2.0</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --primary: #6c63ff;
  --primary-dark: #5148d8;
  --pink: #ff6b9a;
  --yellow: #ffc857;
  --green: #35c98a;
  --blue: #50a8ff;
  --dark: #24243a;
  --muted: #77778a;
  --card: rgba(255,255,255,.88);
}

body {
  margin: 0;
  min-height: 100vh;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: var(--dark);

  background:
    radial-gradient(circle at 15% 10%, #fff4b8 0 8%, transparent 25%),
    radial-gradient(circle at 90% 15%, #d8ccff 0 10%, transparent 30%),
    linear-gradient(135deg, #8ec5fc, #e0c3fc);

  padding: 18px;
}

button {
  font: inherit;
}

.app {
  width: min(100%, 1050px);
  margin: auto;
}

/* HEADER */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.logo {
  font-size: 27px;
  font-weight: 900;
}

.coins {
  background: rgba(255,255,255,.85);
  border-radius: 30px;
  padding: 9px 15px;
  font-weight: 800;
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

/* MAIN */

.game {
  display: grid;
  grid-template-columns: 1.35fr .8fr;
  gap: 18px;
}

.card {
  background: var(--card);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 28px;
  box-shadow: 0 20px 55px rgba(55,45,110,.15);
}

/* PET WORLD */

.world {
  position: relative;
  min-height: 600px;
  overflow: hidden;
}

.sky {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      #92dcff 0%,
      #d8f7ff 68%,
      #8ad56e 68%,
      #66bf59 100%
    );
}

.world.fish .sky {
  background:
    radial-gradient(circle at 20% 25%, rgba(255,255,255,.5) 0 3px, transparent 4px),
    radial-gradient(circle at 75% 40%, rgba(255,255,255,.4) 0 4px, transparent 5px),
    linear-gradient(#48c8f4, #087fc4);
}

.sun {
  position: absolute;
  top: 35px;
  right: 45px;
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #ffe477;
  box-shadow: 0 0 45px #ffe477;
}

.cloud {
  position: absolute;
  width: 110px;
  height: 35px;
  background: rgba(255,255,255,.7);
  border-radius: 40px;
}

.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  background: inherit;
  border-radius: 50%;
}

.cloud::before {
  width: 48px;
  height: 48px;
  left: 20px;
  top: -22px;
}

.cloud::after {
  width: 65px;
  height: 65px;
  right: 10px;
  top: -30px;
}

.cloud.one {
  top: 80px;
  left: 50px;
  animation: cloudMove 16s linear infinite;
}

.cloud.two {
  top: 155px;
  left: 70%;
  transform: scale(.7);
  animation: cloudMove 22s linear infinite reverse;
}

@keyframes cloudMove {
  0% { translate: -30px; }
  50% { translate: 60px; }
  100% { translate: -30px; }
}

/* decorations */

.tree {
  position: absolute;
  bottom: 35px;
  left: 35px;
  font-size: 75px;
}

.tree.two {
  left: auto;
  right: 30px;
  transform: scale(.75);
}

.bamboo {
  display: none;
}

.world.panda .bamboo {
  display: block;
  position: absolute;
  bottom: 30px;
  left: 30px;
  font-size: 65px;
}

.world.panda .tree {
  display: none;
}

/* PET */

.pet-zone {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding-top: 50px;
}

.pet-wrapper {
  text-align: center;
  cursor: pointer;
  position: relative;
}

.pet {
  font-size: 145px;
  line-height: 1;
  user-select: none;
  display: inline-block;

  animation:
    idle 2.7s ease-in-out infinite;

  filter:
    drop-shadow(0 20px 10px rgba(0,0,0,.14));

  transition: transform .2s;
}

.pet:hover {
  transform: scale(1.04);
}

.pet:active {
  transform: scale(.9);
}

@keyframes idle {
  0%,100% {
    transform: translateY(0) rotate(-2deg);
  }

  50% {
    transform: translateY(-14px) rotate(2deg);
  }
}

.pet.happy {
  animation:
    happy .55s ease-in-out infinite alternate;
}

@keyframes happy {
  from { transform: translateY(0) rotate(-8deg) scale(1); }
  to   { transform: translateY(-18px) rotate(8deg) scale(1.05); }
}

.pet.sleeping {
  animation: sleeping 3s ease-in-out infinite;
  filter: grayscale(.2) drop-shadow(0 15px 5px rgba(0,0,0,.1));
}

@keyframes sleeping {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(5px); }
}

.pet.sad {
  animation: sad .9s ease-in-out infinite;
}

@keyframes sad {
  0%,100% { transform: translateY(5px) rotate(0); }
  50% { transform: translateY(15px) rotate(-4deg); }
}

.pet-name {
  margin-top: 15px;
  font-size: 25px;
  font-weight: 900;
}

.pet-level {
  color: var(--muted);
  font-weight: 700;
}

/* SPEECH */

.speech {
  position: absolute;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: 80%;
  background: white;
  padding: 12px 18px;
  border-radius: 22px;
  box-shadow: 0 10px 30px rgba(0,0,0,.12);
  font-weight: 700;
  text-align: center;
  z-index: 5;
  animation: speechIn .3s ease;
}

@keyframes speechIn {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(-8px);
  }
  to {
    opacity: 1;
    transform: translateX(-50%);
  }
}

.speech::after {
  content: "";
  position: absolute;
  bottom: -9px;
  left: 50%;
  transform: translateX(-50%);
  border: 9px solid transparent;
  border-top-color: white;
}

/* PARTICLES */

.particle {
  position: absolute;
  pointer-events: none;
  font-size: 25px;
  animation: particle 1s ease-out forwards;
  z-index: 20;
}

@keyframes particle {
  0% {
    opacity: 1;
    transform: translate(0,0) scale(.5);
  }

  100% {
    opacity: 0;
    transform:
      translate(
        calc(var(--x) * 1px),
        calc(var(--y) * 1px)
      )
      scale(1.3);
  }
}

/* RIGHT PANEL */

.panel {
  padding: 20px;
}

.section-title {
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 12px;
}

/* PET CHOICE */

.pet-choice {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 7px;
  margin-bottom: 18px;
}

.pet-choice button {
  border: 2px solid transparent;
  background: #f3f3f8;
  border-radius: 15px;
  padding: 10px 4px;
  cursor: pointer;
  transition: .2s;
}

.pet-choice button:hover {
  transform: translateY(-3px);
}

.pet-choice button.active {
  border-color: var(--primary);
  background: #eeecff;
}

.pet-choice span {
  display: block;
  font-size: 30px;
}

.pet-choice small {
  font-weight: 800;
}

/* XP */

.xp-box {
  margin-bottom: 20px;
}

.xp-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 6px;
  font-weight: 800;
}

.xp-bar {
  height: 9px;
  background: #e4e4eb;
  border-radius: 20px;
  overflow: hidden;
}

.xp-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg,#8b7dff,#c17cff);
  transition: width .4s;
}

/* STATS */

.stats {
  display: grid;
  gap: 10px;
  margin-bottom: 20px;
}

.stat {
  background: #f7f7fa;
  padding: 11px 13px;
  border-radius: 16px;
}

.stat-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 800;
}

.bar {
  height: 8px;
  border-radius: 20px;
  background: #dedee7;
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 80%;
  border-radius: inherit;
  transition: width .4s;
}

.hunger { background: #ff9f43; }
.happy  { background: #ff6b9a; }
.energy { background: #50a8ff; }
.clean  { background: #35c98a; }

/* ACTIONS */

.actions {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 9px;
}

.action {
  border: none;
  color: white;
  padding: 13px 8px;
  border-radius: 16px;
  cursor: pointer;
  font-weight: 900;
  transition: .18s;
  box-shadow: 0 7px 15px rgba(0,0,0,.08);
}

.action:hover {
  transform: translateY(-3px);
}

.action:active {
  transform: scale(.95);
}

.feed  { background: #ff9f43; }
.play  { background: #ff6b9a; }
.clean { background: #35c98a; }
.sleep { background: #6875d9; }
.pet-btn { background: #9b6cff; }
.gift { background: #f06cc8; }

/* LOG */

.log {
  margin-top: 15px;
  background: #f5f5f8;
  border-radius: 16px;
  padding: 12px;
  height: 105px;
  overflow: auto;
  font-size: 12px;
}

.log div {
  margin-bottom: 5px;
}

/* FOOTER */

.reset {
  width: 100%;
  border: none;
  margin-top: 12px;
  padding: 9px;
  background: transparent;
  color: #999;
  cursor: pointer;
}

/* NIGHT */

body.night {
  background:
    radial-gradient(circle at 15% 10%, #444060 0 8%, transparent 25%),
    linear-gradient(135deg,#20233f,#3d315d);
}

body.night .card {
  background: rgba(35,35,55,.92);
  color: white;
}

body.night .coins {
  background: rgba(35,35,55,.9);
}

body.night .stat,
body.night .log,
body.night .pet-choice button {
  background: rgba(255,255,255,.08);
  color: white;
}

/* MOBILE */

@media (max-width: 780px) {

  body {
    padding:
      10px
      10px
      calc(10px + env(safe-area-inset-bottom));
  }

  .game {
    grid-template-columns: 1fr;
  }

  .world {
    min-height: 470px;
  }

  .pet {
    font-size: 110px;
  }

  .panel {
    padding: 16px;
  }

  .logo {
    font-size: 22px;
  }
}

@media (max-width: 430px) {

  .world {
    min-height: 430px;
  }

  .pet {
    font-size: 95px;
  }

  .speech {
    font-size: 13px;
  }

  .actions {
    grid-template-columns: repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="logo">
      🐾 Digital Pet
    </div>

    <div class="coins">
      🪙 <span id="coins">100</span>
    </div>

  </header>


  <main class="game">

    <!-- =========================
         WORLD
    ========================== -->

    <section class="card world" id="world">

      <div class="sky"></div>

      <div class="sun"></div>

      <div class="cloud one"></div>
      <div class="cloud two"></div>

      <div class="tree">🌳</div>
      <div class="tree two">🌳</div>

      <div class="bamboo">🎋</div>

      <div class="speech" id="speech">
        Halo! Aku baru bangun 🥺
      </div>


      <div class="pet-zone">

        <div class="pet-wrapper" id="petWrapper">

          <div class="pet" id="pet">
            🐟
          </div>

          <div class="pet-name" id="petName">
            Bubbles
          </div>

          <div class="pet-level">
            Level <span id="level">1</span>
          </div>

        </div>

      </div>

    </section>


    <!-- =========================
         CONTROL PANEL
    ========================== -->

    <section class="card panel">

      <div class="section-title">
        Pilih temanmu
      </div>


      <div class="pet-choice">

        <button data-type="fish" class="active">
          <span>🐟</span>
          <small>Ikan</small>
        </button>

        <button data-type="dog">
          <span>🐶</span>
          <small>Anjing</small>
        </button>

        <button data-type="cat">
          <span>🐱</span>
          <small>Kucing</small>
        </button>

        <button data-type="panda">
          <span>🐼</span>
          <small>Panda</small>
        </button>

      </div>


      <!-- XP -->

      <div class="xp-box">

        <div class="xp-label">

          <span>⭐ XP</span>

          <span>
            <span id="xp">0</span>/100
          </span>

        </div>

        <div class="xp-bar">
          <div class="xp-fill" id="xpBar"></div>
        </div>

      </div>


      <!-- STATS -->

      <div class="section-title">
        Kondisi
      </div>

      <div class="stats">

        <div class="stat">

          <div class="stat-top">
            <span>🍖 Kenyang</span>
            <span id="hungerText">80</span>
          </div>

          <div class="bar">
            <div
              class="fill hunger"
              id="hungerBar">
            </div>
          </div>

        </div>


        <div class="stat">

          <div class="stat-top">
            <span>❤️ Bahagia</span>
            <span id="happyText">80</span>
          </div>

          <div class="bar">
            <div
              class="fill happy"
              id="happyBar">
            </div>
          </div>

        </div>


        <div class="stat">

          <div class="stat-top">
            <span>⚡ Energi</span>
            <span id="energyText">80</span>
          </div>

          <div class="bar">
            <div
              class="fill energy"
              id="energyBar">
            </div>
          </div>

        </div>


        <div class="stat">

          <div class="stat-top">
            <span>✨ Bersih</span>
            <span id="cleanText">80</span>
          </div>

          <div class="bar">
            <div
              class="fill clean"
              id="cleanBar">
            </div>
          </div>

        </div>

      </div>


      <!-- ACTIONS -->

      <div class="section-title">
        Lakukan sesuatu
      </div>

      <div class="actions">

        <button
          class="action feed"
          onclick="feed()">
          🍖 Makan
        </button>

        <button
          class="action play"
          onclick="play()">
          🎾 Main
        </button>

        <button
          class="action clean"
          onclick="cleanPet()">
          🧼 Mandi
        </button>

        <button
          class="action sleep"
          onclick="sleepPet()">
          😴 Tidur
        </button>

        <button
          class="action pet-btn"
          onclick="petPet()">
          🥰 Elus
        </button>

        <button
          class="action gift"
          onclick="giveGift()">
          🎁 Hadiah
        </button>

      </div>


      <!-- LOG -->

      <div class="log" id="log"></div>


      <button
        class="reset"
        onclick="resetGame()">
        Reset permainan
      </button>

    </section>

  </main>

</div>


<script>

/* ==================================================
   PET DATA
================================================== */

const PETS = {

  fish: {
    emoji: "🐟",
    name: "Bubbles",
    environment: "fish",
    intro: "Blub blub! Senang bertemu kamu! 🫧",
    hungry: "Aku lapar... kasih makan dong 🥺",
    happy: "Blub blub! Aku bahagia! 🫧",
    sad: "Aku merasa sendirian... 😢"
  },

  dog: {
    emoji: "🐶",
    name: "Buddy",
    environment: "dog",
    intro: "GUK GUK! Kamu datang! 🐶",
    hungry: "Aku lapar banget! 🍖",
    happy: "KAMU TERBAIK! ❤️",
    sad: "Kok kamu tinggalin aku... 🥺"
  },

  cat: {
    emoji: "🐱",
    name: "Mochi",
    environment: "cat",
    intro: "Meow... akhirnya kamu datang. 😼",
    hungry: "Aku lapar. Sekarang. 😾",
    happy: "Hmm... lumayan. 😽",
    sad: "Aku pura-pura nggak peduli... 😿"
  },

  panda: {
    emoji: "🐼",
    name: "Bamboo",
    environment: "panda",
    intro: "BAMBOO! 🎋",
    hungry: "Ada bambu nggak? 🎋",
    happy: "Hehehe... kenyang. 🐼",
    sad: "Aku butuh pelukan... 🥺"
  }

};


/* ==================================================
   GAME STATE
================================================== */

let state = {

  type: "fish",

  hunger: 80,
  happiness: 80,
  energy: 80,
  cleanliness: 80,

  coins: 100,

  xp: 0,
  level: 1,

  age: 1,

  sleeping: false,

  lastTick: Date.now()

};


/* ==================================================
   ELEMENTS
================================================== */

const pet = document.getElementById("pet");
const petName = document.getElementById("petName");
const speech = document.getElementById("speech");
const world = document.getElementById("world");
const coins = document.getElementById("coins");
const xp = document.getElementById("xp");
const xpBar = document.getElementById("xpBar");
const level = document.getElementById("level");
const logBox = document.getElementById("log");


/* ==================================================
   SAVE
================================================== */

function save() {

  localStorage.setItem(
    "digitalPet2",
    JSON.stringify(state)
  );

}


/* ==================================================
   LOAD
================================================== */

function load() {

  const saved =
    localStorage.getItem("digitalPet2");

  if (saved) {

    try {
      state = JSON.parse(saved);
    }

    catch {
      console.log("Save rusak.");
    }

  }

  update();

}


/* ==================================================
   UI
================================================== */

function update() {

  const data = PETS[state.type];

  pet.textContent = data.emoji;
  petName.textContent = data.name;

  world.className =
    "card world " + data.environment;


  coins.textContent =
    Math.floor(state.coins);


  level.textContent =
    state.level;


  xp.textContent =
    Math.floor(state.xp);

  xpBar.style.width =
    state.xp + "%";


  setStat(
    "hunger",
    state.hunger
  );

  setStat(
    "happy",
    state.happiness
  );

  setStat(
    "energy",
    state.energy
  );

  setStat(
    "clean",
    state.cleanliness
  );


  document
    .querySelectorAll(".pet-choice button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.type === state.type
      );

    });


  updateMood();

}


/* ==================================================
   STATS
================================================== */

function setStat(name, value) {

  value =
    Math.max(
      0,
      Math.min(100, Math.round(value))
    );


  document.getElementById(
    name + "Bar"
  ).style.width =
    value + "%";


  document.getElementById(
    name + "Text"
  ).textContent =
    value;

}


/* ==================================================
   MOOD
================================================== */

function updateMood() {

  pet.classList.remove(
    "happy",
    "sad",
    "sleeping"
  );


  if (state.sleeping) {

    pet.classList.add("sleeping");

    speech.textContent =
      "Zzzzz... jangan ganggu aku 😴";

    return;

  }


  const average =
    (
      state.hunger +
      state.happiness +
      state.energy +
      state.cleanliness
    ) / 4;


  if (average >= 80) {

    pet.classList.add("happy");

  }

  else if (average < 35) {

    pet.classList.add("sad");

  }


  const data =
    PETS[state.type];


  if (state.hunger < 25) {

    speech.textContent =
      data.hungry;

  }

  else if (state.happiness < 25) {

    speech.textContent =
      data.sad;

  }

  else if (average >= 75) {

    speech.textContent =
      data.happy;

  }

}


/* ==================================================
   SPEAK
================================================== */

function say(text) {

  speech.textContent = text;

  speech.style.animation = "none";

  void speech.offsetWidth;

  speech.style.animation =
    "speechIn .3s ease";

}


/* ==================================================
   PARTICLES
================================================== */

function particles(
  emoji,
  amount = 8
) {

  const rect =
    pet.getBoundingClientRect();


  for (let i = 0; i < amount; i++) {

    const p =
      document.createElement("div");

    p.className =
      "particle";

    p.textContent =
      emoji;


    p.style.left =
      (
        rect.left +
        rect.width / 2
      ) + "px";


    p.style.top =
      (
        rect.top +
        rect.height / 2
      ) + "px";


    p.style.setProperty(
      "--x",
      Math.random() * 180 - 90
    );


    p.style.setProperty(
      "--y",
      -(Math.random() * 150 + 50)
    );


    document.body.appendChild(p);


    setTimeout(
      () => p.remove(),
      1000
    );

  }

}


/* ==================================================
   LOG
================================================== */

function log(message) {

  const line =
    document.createElement("div");

  line.textContent =
    "• " + message;


  logBox.prepend(line);


  while (logBox.children.length > 12) {

    logBox.lastChild.remove();

  }

}


/* ==================================================
   XP
================================================== */

function gainXP(amount) {

  state.xp += amount;


  if (state.xp >= 100) {

    state.xp -= 100;

    state.level++;

    state.coins += 50;

    say(
      `LEVEL UP! 🎉 Sekarang level ${state.level}!`
    );

    particles("⭐", 15);

    log(
      `Naik ke level ${state.level}! +50 coin`
    );

  }

}


/* ==================================================
   FEED
================================================== */

function feed() {

  if (state.sleeping) {

    say("Aku lagi tidur... 😴");

    return;

  }


  state.hunger += 25;
  state.happiness += 6;
  state.cleanliness -= 2;

  gainXP(8);

  particles("🍖", 8);

  const reactions = {

    fish: "NYAM NYAM! 🐟",
    dog: "WOOOW! ENAK BANGET! 🐶",
    cat: "Aku sebenarnya nggak lapar... tapi ya sudah 😼",
    panda: "BAMBOOOOO! 🎋🐼"

  };


  say(
    reactions[state.type]
  );


  log(
    `${PETS[state.type].name} makan.`
  );


  clamp();

  save();

  update();

}


/* ==================================================
   PLAY
================================================== */

function play() {

  if (state.sleeping) {

    say("Aku masih tidur 😴");

    return;

  }


  if (state.energy < 20) {

    say("Aku capek... nanti aja ya 🥺");

    return;

  }


  state.happiness += 25;
  state.energy -= 20;
  state.hunger -= 10;
  state.cleanliness -= 5;

  state.coins += 5;

  gainXP(15);

  particles("❤️", 12);


  const reactions = {

    fish: "Lihat aku berenang! 🫧",
    dog: "LEMPAR BOLANYA! 🎾",
    cat: "Aku akan bermain... sebentar saja. 😼",
    panda: "Gulat panda! 🐼"

  };


  say(
    reactions[state.type]
  );


  log(
    `${PETS[state.type].name} bermain. +5 coin`
  );


  clamp();

  save();

  update();

}


/* ==================================================
   CLEAN
================================================== */

function cleanPet() {

  if (state.sleeping) {

    say("Aku lagi tidur... 💤");

    return;

  }


  state.cleanliness += 35;
  state.happiness += 5;

  gainXP(6);

  particles("✨", 12);

  say(
    "Wangi banget sekarang! ✨"
  );


  log(
    `${PETS[state.type].name} sekarang bersih.`
  );


  clamp();

  save();

  update();

}


/* ==================================================
   PET PET
================================================== */

function petPet() {

  if (state.sleeping) {

    say("Ssst... aku tidur 😴");

    return;

  }


  state.happiness += 12;

  gainXP(4);

  particles("❤️", 8);


  const reactions = {

    fish: "Blub blub blub 🫧❤️",
    dog: "GUK! GUK! Aku sayang kamu! 🐶❤️",
    cat: "Purr... purr... 😽",
    panda: "Hmmm... nyaman... 🐼"

  };


  say(
    reactions[state.type]
  );


  log(
    `Kamu mengelus ${PETS[state.type].name}.`
  );


  clamp();

  save();

  update();

}


/* ==================================================
   SLEEP
================================================== */

function sleepPet() {

  if (state.sleeping) {

    state.sleeping = false;

    say("Aku sudah bangun! ☀️");

    log(
      `${PETS[state.type].name} bangun.`
    );

  }

  else {

    state.sleeping = true;

    say("Zzzzz... selamat malam 💤");

    log(
      `${PETS[state.type].name} tidur.`
    );

  }


  save();

  update();

}


/* ==================================================
   GIFT
================================================== */

function giveGift() {

  if (state.coins < 20) {

    say(
      "Coin kamu kurang 😭"
    );

    return;

  }


  state.coins -= 20;

  state.happiness += 30;

  state.xp += 20;

  particles("🎁", 10);

  say(
    "WAAAA! HADIAH BUAT AKU?! 😭❤️"
  );


  log(
    `Memberikan hadiah. -20 coin`
  );


  clamp();

  save();

  update();

}


/* ==================================================
   PET SELECTION
================================================== */

document
  .querySelectorAll(".pet-choice button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const type =
          button.dataset.type;


        if (type === state.type) {

          say(
            "Aku sudah jadi temanmu kok 😆"
          );

          return;

        }


        state.type = type;

        state.sleeping = false;

        const data =
          PETS[type];


        say(
          data.intro
        );


        particles("✨", 12);


        log(
          `Sekarang kamu memelihara ${data.name}.`
        );


        save();

        update();

      }
    );

  });


/* ==================================================
   CLICK PET
================================================== */

document
  .getElementById("petWrapper")
  .addEventListener(
    "click",
    petPet
  );


/* ==================================================
   GAME TICK
================================================== */

setInterval(() => {

  if (state.sleeping) {

    state.energy += 5;

    state.hunger -= 2;

  }

  else {

    state.hunger -= 1;
    state.happiness -= .6;
    state.energy -= .4;
    state.cleanliness -= .4;

  }


  clamp();

  save();

  update();

}, 10000);


/* ==================================================
   AGE
================================================== */

setInterval(() => {

  state.age++;

  log(
    `${PETS[state.type].name} bertambah umur! 🎂`
  );

  state.coins += 10;

  save();

  update();

}, 60000);


/* ==================================================
   NIGHT MODE
================================================== */

function checkNight() {

  const hour =
    new Date().getHours();


  if (
    hour >= 19 ||
    hour < 6
  ) {

    document.body.classList.add("night");

  }

  else {

    document.body.classList.remove("night");

  }

}


setInterval(
  checkNight,
  60000
);

checkNight();


/* ==================================================
   CLAMP
================================================== */

function clamp() {

  state.hunger =
    Math.max(
      0,
      Math.min(100,state.hunger)
    );


  state.happiness =
    Math.max(
      0,
      Math.min(100,state.happiness)
    );


  state.energy =
    Math.max(
      0,
      Math.min(100,state.energy)
    );


  state.cleanliness =
    Math.max(
      0,
      Math.min(100,state.cleanliness)
    );


  state.coins =
    Math.max(
      0,
      state.coins
    );


  state.xp =
    Math.max(
      0,
      Math.min(100,state.xp)
    );

}


/* ==================================================
   RESET
================================================== */

function resetGame() {

  if (
    !confirm(
      "Hapus semua progress Digital Pet?"
    )
  ) return;


  localStorage.removeItem(
    "digitalPet2"
  );


  location.reload();

}


/* ==================================================
   START
================================================== */

load();

log(
  "Selamat datang di Digital Pet! 🐾"
);

</script>
